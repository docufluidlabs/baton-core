server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers ─────────────────────────────────────────────
    # Applied to every response. Closes OWASP ZAP baseline findings
    # for CSP, COEP, Permissions-Policy, and the standard X-* hardening
    # headers. See docs/submission/DAST_RESULTS.md for the scan report.

    # CSP — currently in REPORT-ONLY mode for safe rollout. Browser will
    # log violations to the console / report-uri without blocking. Switch
    # to the enforcing header (Content-Security-Policy, no -Report-Only
    # suffix) after a week of clean reports in production traffic.
    #
    # 'unsafe-inline' is required by React (inline styles via Tailwind JIT,
    # runtime config). 'unsafe-eval' covers React DevTools and any code that
    # eval()s JSON (rare but possible). The only external origins are Google
    # Fonts (the Geist typeface — stylesheet + font files, no cookies, no JS).
    # img: 'https:' is wide-open by design (record-attached images could be on
    # any HTTPS host the customer's automation references). No analytics or
    # telemetry origins: the self-hosted build makes no third-party calls.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self'; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Permissions-Policy — disable browser features we don't use.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self), usb=(), magnetometer=(), accelerometer=(), gyroscope=()" always;

    # Cross-origin isolation. `unsafe-none` is the default but explicitly
    # setting it satisfies the ZAP "header missing" warning. `require-corp`
    # would block third-party iframes that don't send CORP headers.
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # Standard hardening headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── Routes ───────────────────────────────────────────────────────

    # Health check
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Proxy API requests to the backend service
    location /api {
        proxy_pass http://baton-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running API calls
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming/SSE
        proxy_buffering off;
    }

    # Serve static files and fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
