# Baton self-host quickstart: frontend (/) and backend (/api) on one domain (http://localhost).
#
# By default this pulls the published release images:
#   docker compose up -d
# Pin a version (recommended for production) by setting BATON_VERSION, e.g. in a
# root-level .env file next to this compose file:
#   BATON_VERSION=1.0.0
# Build from source instead (contributors / unreleased changes):
#   docker compose up -d --build
#
# First boot creates all DynamoDB tables and SQS queues in LocalStack automatically —
# no host-side tooling beyond Docker is required.
#
# For production deployments, set APP_URL / API_URL / FRONTEND_URL to your public URL,
# terminate SSL externally (reverse proxy / load balancer), and use real AWS instead of
# LocalStack (see baton/infrastructure/ for CloudFormation templates).

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb,sqs
      DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - baton-net

  baton-api:
    image: ghcr.io/docufluidlabs/baton-api:${BATON_VERSION:-latest}
    build:
      context: ./baton
      dockerfile: Dockerfile
    container_name: baton-api
    restart: unless-stopped
    env_file: ./baton/.env
    environment:
      PORT: "3001"
      APP_URL: "${APP_URL:-http://localhost}"
      API_URL: "${API_URL:-http://localhost}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost}"
      DYNAMODB_ENDPOINT: "http://localstack:4566"
      SQS_ENDPOINT: "http://localstack:4566"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - baton-net
    # Only expose to host for direct debugging; nginx handles public traffic
    # ports:
    #   - "3001:3001"

  baton-front:
    image: ghcr.io/docufluidlabs/baton-front:${BATON_VERSION:-latest}
    build:
      context: ./baton-front
      dockerfile: Dockerfile
    container_name: baton-front
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      baton-api:
        condition: service_healthy
    networks:
      - baton-net

networks:
  baton-net:
    driver: bridge

volumes:
  localstack-data:
