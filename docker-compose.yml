# Baton self-host quickstart: frontend (/) and backend (/api) on one domain (http://localhost).
#
# Images: pulls the published release images by default (set BATON_VERSION to pin, e.g. "1.0.0"
# in a root-level .env file next to this compose file):
#   docker compose pull && docker compose up -d
# Building from source instead (contributors / unreleased changes):
#   docker compose up -d --build
#
# Local AWS emulation (no accounts, no license keys):
#   - DynamoDB → amazon/dynamodb-local (data persists in the dynamodb-data volume)
#   - SQS      → softwaremill/elasticmq-native (queues are recreated on boot;
#                in-flight messages are not retained across restarts)
# First boot creates all tables and queues automatically — no host-side tooling
# beyond Docker is required.
#
# For production deployments use docker-compose.prod.yml with real AWS —
# see docs/deploy-production.md.

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: baton-dynamodb
    restart: unless-stopped
    # Named volumes are root-owned; the image's default user can't write there.
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/data
    healthcheck:
      # DynamoDB Local answers 400 to a bare GET — any HTTP response means it's up.
      test: ["CMD-SHELL", "curl -s http://localhost:8000 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - baton-net

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: baton-elasticmq
    restart: unless-stopped
    # Scratch-based image (no shell) → no container healthcheck; the API retries
    # its queue setup at boot until ElasticMQ answers.
    ports:
      - "9324:9324"
    networks:
      - baton-net

  baton-api:
    image: ghcr.io/docufluidlabs/baton-api:${BATON_VERSION:-latest}
    build:
      context: ./baton
      dockerfile: Dockerfile
    container_name: baton-api
    restart: unless-stopped
    env_file: ./baton/.env
    environment:
      PORT: "3001"
      APP_URL: "${APP_URL:-http://localhost}"
      API_URL: "${API_URL:-http://localhost}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost}"
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      SQS_ENDPOINT: "http://elasticmq:9324"
      # The emulators don't validate credentials, but the AWS SDK needs some.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-local}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-local}"
    depends_on:
      dynamodb:
        condition: service_healthy
      elasticmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - baton-net
    # Only expose to host for direct debugging; nginx handles public traffic
    # ports:
    #   - "3001:3001"

  baton-front:
    image: ghcr.io/docufluidlabs/baton-front:${BATON_VERSION:-latest}
    build:
      context: ./baton-front
      dockerfile: Dockerfile
    container_name: baton-front
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      baton-api:
        condition: service_healthy
    networks:
      - baton-net

networks:
  baton-net:
    driver: bridge

volumes:
  dynamodb-data:
