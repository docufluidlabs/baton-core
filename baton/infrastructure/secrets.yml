AWSTemplateFormatVersion: '2010-09-09'
Description: 'Baton — Secrets Manager'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production

Resources:
  # ============= API Credentials Secret =============
  ApiCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'baton-api-credentials-${Environment}'
      Description: 'API credentials for Baton platform integrations'
      SecretString: !Sub |
        {
          "CLERK_PUBLISHABLE_KEY": "placeholder-update-me",
          "CLERK_SECRET_KEY": "placeholder-update-me",
          "CLERK_WEBHOOK_SECRET": "placeholder-update-me",
          "DOCUSIGN_INTEGRATION_KEY": "placeholder-update-me",
          "DOCUSIGN_SECRET_KEY": "placeholder-update-me",
          "DOCUSIGN_RSA_PRIVATE_KEY": "placeholder-update-me",
          "DOCUSIGN_ACCOUNT_ID": "placeholder-update-me",
          "DOCUSIGN_CONNECT_HMAC_KEY": "placeholder-update-me",
          "PROCORE_CLIENT_ID": "placeholder-update-me",
          "PROCORE_CLIENT_SECRET": "placeholder-update-me",
          "PROCORE_WEBHOOK_SECRET": "placeholder-update-me",
          "XERO_CLIENT_ID": "placeholder-update-me",
          "XERO_CLIENT_SECRET": "placeholder-update-me",
          "XERO_WEBHOOK_KEY": "placeholder-update-me",
          "BAMBOOHR_CLIENT_ID": "placeholder-update-me",
          "BAMBOOHR_CLIENT_SECRET": "placeholder-update-me",
          "ZOHO_CLIENT_ID": "placeholder-update-me",
          "ZOHO_CLIENT_SECRET": "placeholder-update-me",
          "SMARTSHEET_CLIENT_ID": "placeholder-update-me",
          "SMARTSHEET_CLIENT_SECRET": "placeholder-update-me",
          "STRIPE_SECRET_KEY": "placeholder-update-me",
          "STRIPE_WEBHOOK_SECRET": "placeholder-update-me",
          "RESEND_API_KEY": "placeholder-update-me",
          "SLACK_BOT_TOKEN": "placeholder-update-me",
          "SENTRY_DSN": "placeholder-update-me"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: baton

  # ============= Encryption Key Secret =============
  EncryptionKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'baton-encryption-key-${Environment}'
      Description: 'Encryption key for OAuth token storage (AES-256-GCM)'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: 'TOKEN_ENCRYPTION_KEY'
        PasswordLength: 64
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: baton

  # ============= Rotation Schedule =============
  EncryptionKeyRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: EncryptionKeySecret
    Properties:
      SecretId: !Ref EncryptionKeySecret
      RotationRules:
        AutomaticallyAfterDays: 90
      # Note: Rotation requires a Lambda function to be implemented
      # RotationLambdaARN: !Ref RotationLambdaArn

Outputs:
  ApiCredentialsSecretArn:
    Value: !Ref ApiCredentialsSecret
    Export:
      Name: !Sub '${AWS::StackName}-ApiCredentialsSecretArn'

  EncryptionKeySecretArn:
    Value: !Ref EncryptionKeySecret
    Export:
      Name: !Sub '${AWS::StackName}-EncryptionKeySecretArn'

  ApiCredentialsSecretName:
    Value: !Sub 'baton-api-credentials-${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiCredentialsSecretName'
