AWSTemplateFormatVersion: '2010-09-09'
Description: 'Baton — DynamoDB Tables'

# ─────────────────────────────────────────────────────────────────────────
# GENERATED FILE — do not edit by hand.
# Source of truth: baton/src/db/table-definitions.ts
# Regenerate with:  cd baton && npm run infra:generate
# Intended for fresh stacks; DynamoDB allows only one GSI change per stack
# update, so reconciling a drifted existing stack may need multiple deploys.
# ─────────────────────────────────────────────────────────────────────────

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Deployment environment

  TablePrefix:
    Type: String
    Default: baton-
    Description: Prefix for DynamoDB table names

  EnablePointInTimeRecovery:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  IsProduction: !Equals [!Ref Environment, 'production']
  EnablePITR: !Equals [!Ref EnablePointInTimeRecovery, 'true']

Resources:
  # ============= Organizations =============
  OrganizationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${TablePrefix}organizations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: slug-index
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [EnablePITR, true, false]
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: baton

  # ============= Users =============
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
