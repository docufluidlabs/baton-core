name: release

# Tag-driven release: pushing a semver tag (v1.2.3, v1.2.3-rc.1) builds and publishes
# both container images to GHCR, then creates a GitHub Release with generated notes.
#
#   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
#
# Image tags: {X.Y.Z} always; {X.Y} and `latest` only for stable (non-prerelease) tags.
#
# A tag runs the workflow file it points at. To publish an existing tag with the
# workflow as it is on main, start it by hand (Actions -> release -> Run workflow,
# or `gh workflow run release.yml -f tag=v1.2.3`).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # A healthy multi-arch build finishes in ~10 minutes; a silent QEMU hang
    # otherwise burns the 6-hour default before anyone notices.
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: baton-api
            context: ./baton
          - image: baton-front
            context: ./baton-front
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag (expected v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=${{ !contains(env.RELEASE_TAG, '-') }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      # The GitHub CLI ships with the runner, so the release needs no
      # third-party action.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists - leaving it as it is."
          else
            gh release create "$RELEASE_TAG" "${flags[@]}"
          fi
